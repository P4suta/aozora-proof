name: setup-rust
description: Pinned Rust toolchain + mold + cargo cache (+ optional tools), shared by every CI job.

inputs:
  components:
    description: 'Comma-separated rustup components, e.g. "rustfmt, clippy".'
    required: false
    default: ""
  targets:
    description: 'Comma-separated rustup targets, e.g. "wasm32-unknown-unknown".'
    required: false
    default: ""
  tools:
    description: 'Comma-separated cargo tools for taiki-e/install-action, e.g. "cargo-nextest@0.9.137". Pin to mise config.'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      id: toolchain
      with:
        toolchain: 1.99.1
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - id: pin
      shell: bash
      env:
        INSTALLED: ${{ steps.toolchain.outputs.name }}
      run: |
        toolchain=$(sed -n 's/.*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)
        [[ "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        [[ "$toolchain" == "$INSTALLED" ]]
    - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - if: ${{ inputs.tools != '' }}
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: ${{ inputs.tools }}
