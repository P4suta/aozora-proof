name: release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Qualified full commit SHA to recover or publish"
        required: true
        type: string
      dry_run:
        description: "Verify qualification and assets without changing GitHub state"
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify qualified commit
    runs-on: ubuntu-24.04
    outputs:
      qualification_run: ${{ steps.qualification.outputs.run_id }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate input
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit must be a full lowercase SHA-1" >&2
            exit 2
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust

      - name: Require commit on main
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$COMMIT" origin/main

      - name: Read and validate version
        id: version
        run: |
          version=$(tr -d '[:space:]' <version.txt)
          cargo run --quiet --locked -p xtask -- release check
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=v$version" >>"$GITHUB_OUTPUT"

      - name: Locate successful qualification
        id: qualification
        env:
          ARTIFACT_NAME: release-qualified-${{ inputs.commit }}
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-ready.yml/runs?head_sha=${COMMIT}&status=success&per_page=100" \
            --jq '.workflow_runs[]
              | select(
                  .head_sha == env.COMMIT
                  and (.event == "push" or .event == "workflow_dispatch")
                )
              | [.created_at, (.id | tostring)]
              | @tsv' |
            sort --reverse |
            while IFS=$'\t' read -r _ candidate; do
              artifact_count=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts?name=${ARTIFACT_NAME}" \
                --jq '[.artifacts[]
                  | select(.name == env.ARTIFACT_NAME and (.expired | not))]
                  | length')
              if [[ "$artifact_count" -gt 0 ]]; then
                printf '%s\n' "$candidate"
                break
              fi
            done)
          if [[ -z "$run_id" ]]; then
            echo "no successful release-ready run with qualified artifacts exists for $COMMIT" >&2
            exit 1
          fi
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-qualified-${{ inputs.commit }}
          path: qualified
          github-token: ${{ github.token }}
          run-id: ${{ steps.qualification.outputs.run_id }}

      - name: Validate qualified assets
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo run --quiet --locked -p xtask -- release artifact-check \
            qualified/release-manifest.json \
            --commit "$COMMIT" \
            --version "$VERSION"
          (
            cd qualified
            sha256sum --check SHA256SUMS
            for checksum in *.tar.gz.sha256; do
              sha256sum --check "$checksum"
            done
          )

      - name: Dry-run result
        if: inputs.dry_run
        env:
          COMMIT: ${{ inputs.commit }}
          TAG: ${{ steps.version.outputs.tag }}
        run: echo "dry-run verified qualified $COMMIT for $TAG; no GitHub state was changed"

  draft:
    name: create tag and draft
    if: ${{ !inputs.dry_run }}
    needs: verify
    runs-on: ubuntu-24.04
    environment: release-please
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Create release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: aozora-proof
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-qualified-${{ inputs.commit }}
          path: qualified
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify.outputs.qualification_run }}

      - name: Attest qualified archives
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: qualified/*.tar.gz

      - name: Create immutable release candidate
        id: draft
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          existing_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
            --jq '.object.sha' 2>/dev/null || true)
          if [[ -n "$existing_ref" && "$existing_ref" != "$COMMIT" ]]; then
            echo "$TAG already points to unqualified commit $existing_ref" >&2
            exit 1
          fi
          if [[ -z "$existing_ref" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              --field ref="refs/tags/${TAG}" \
              --field sha="$COMMIT" >/dev/null
          fi

          release_state=$(gh release view "$TAG" --json isDraft --jq \
            'if .isDraft then "draft" else "published" end' 2>/dev/null || true)
          if [[ -z "$release_state" ]]; then
            gh release create "$TAG" \
              --draft \
              --generate-notes \
              --target "$COMMIT" \
              --title "$TAG"
            release_state=draft
          fi
          if [[ "$release_state" == "draft" ]]; then
            gh release upload "$TAG" --clobber \
              qualified/*.tar.gz \
              qualified/*.tar.gz.sha256 \
              qualified/*.spdx.json \
              qualified/SHA256SUMS \
              qualified/release-manifest.json
          fi
          expected_assets=$(
            {
              jq --raw-output \
                '.artifacts[] | .archive, (.archive + ".sha256"), .sbom' \
                qualified/release-manifest.json
              printf '%s\n' SHA256SUMS release-manifest.json
            } | sort
          )
          actual_assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "$TAG asset set does not match release-manifest.json" >&2
            diff <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi
          echo "state=$release_state" >>"$GITHUB_OUTPUT"

      - name: Dispatch approval and publication on the tag
        env:
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh workflow run publish-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            --field commit="$COMMIT"
