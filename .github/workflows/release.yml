name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  metadata:
    name: release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
      - name: Validate tag and generate manuals
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq --raw-output '.packages[] | select(.name == "aozora-proof-cli") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$RELEASE_TAG" != "v${version}" ]]; then
            echo "tag $RELEASE_TAG does not match workspace version $version" >&2
            exit 2
          fi
          mkdir -p release-metadata/share/man/man1 release-metadata/share/completions
          cargo run --locked --quiet -p aozora-proof-cli -- man \
            > release-metadata/share/man/man1/aozora-proof.1
          for shell in bash zsh fish powershell elvish; do
            cargo run --locked --quiet -p aozora-proof-cli -- completions "$shell" \
              > "release-metadata/share/completions/aozora-proof.${shell}"
          done
          cp README.md LICENSE-APACHE LICENSE-MIT NOTICE release-metadata/
      - uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: release-metadata
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            executable: aozora-proof
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            executable: aozora-proof
          - target: x86_64-apple-darwin
            os: macos-15
            executable: aozora-proof
          - target: aarch64-apple-darwin
            os: macos-15
            executable: aozora-proof
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            executable: aozora-proof.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Build release binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          toolchain: "1.95.0"
          args: "--locked --release -p aozora-proof-cli"
          strip: true
      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: release-metadata
      - name: Package archive
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          WORKSPACE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            tag="v${WORKSPACE_VERSION}-dev"
          fi
          package="aozora-proof-${tag}-${TARGET}"
          mkdir -p "dist/${package}/bin"
          cp "target/${TARGET}/release/${EXECUTABLE}" "dist/${package}/bin/"
          cp -R release-metadata/. "dist/${package}/"
          archive="${package}.tar.gz"
          tar -C dist -czf "dist/${archive}" "$package"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$archive" > "${archive}.sha256"
            else
              shasum --algorithm 256 "$archive" > "${archive}.sha256"
            fi
          )
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Write aggregate checksums
        working-directory: release-assets
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release-assets
          artifact-name: aozora-proof-${{ github.ref_name }}.spdx.json
          output-file: release-assets/aozora-proof-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest archives
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*.tar.gz
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/SHA256SUMS
            release-assets/*.spdx.json
