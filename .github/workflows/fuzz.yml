name: fuzz

on:
  schedule:
    - cron: "37 4 * * 1" # Mondays, 04:37 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [run_all, gaiji, fix, wire]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # cargo-fuzz / libFuzzer need nightly; the detached fuzz crate pins a
      # dated toolchain so scheduled runs remain reproducible.
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0 action
        with:
          toolchain: nightly-2026-07-15
          targets: x86_64-unknown-linux-gnu
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fuzz ${{ matrix.target }}
        # The dated nightly is independent from the tree-wide stable pin.
        # `--target …-gnu`: cargo-fuzz's host default resolved to a static-musl
        # target on the runner, which the address sanitizer rejects; pin the
        # dynamic-libc gnu target explicitly.
        run: cargo +nightly-2026-07-15 fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- -max_total_time=120
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
