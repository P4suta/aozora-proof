name: fuzz

on:
  schedule:
    - cron: "37 4 * * 1" # Mondays, 04:37 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [run_all, gaiji, fix, wire]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-fuzz / libFuzzer need nightly; the detached fuzz crate pins a
      # dated toolchain so scheduled runs remain reproducible.
      - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0 action
        with:
          toolchain: nightly-2026-10-14
          targets: x86_64-unknown-linux-gnu
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fuzz ${{ matrix.target }}
        # The dated nightly is independent from the tree-wide stable pin.
        # `--target …-gnu`: cargo-fuzz's host default resolved to a static-musl
        # target on the runner, which the address sanitizer rejects; pin the
        # dynamic-libc gnu target explicitly.
        run: cargo +nightly-2026-07-15 fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- -max_total_time=120
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
