name: "Aozora Proof"
description: "Run submission-quality checks for Aozora Bunko text and optionally upload SARIF."
author: "aozora-proof contributors"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  files:
    description: "Space-separated files or globs to check."
    required: false
    default: "**/*.txt"
  orthography:
    description: "Character-form policy: modern, traditional, or mixed."
    required: false
    default: "mixed"
  fail-on:
    description: "Fail on findings at or above error, warning, or note."
    required: false
    default: "error"
  version:
    description: "aozora-proof release version. Required for SHA or branch Action references."
    required: false
  upload-sarif:
    description: "Upload results to code scanning; requires security-events: write."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install verified release
      shell: bash
      env:
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
        GH_TOKEN: ${{ github.token }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        version="${INPUT_VERSION#v}"
        if [[ -z "$version" ]]; then
          if [[ "$ACTION_REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "aozora-proof: input 'version' is required when the Action is referenced by a branch or SHA (got '${ACTION_REF:-unknown}')" >&2
            exit 2
          fi
        fi
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "aozora-proof: version must be a stable X.Y.Z release (got '$version')" >&2
          exit 2
        fi
        tag="v${version}"
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) target="x86_64-unknown-linux-musl" ;;
          Linux-ARM64) target="aarch64-unknown-linux-musl" ;;
          macOS-X64) target="x86_64-apple-darwin" ;;
          macOS-ARM64) target="aarch64-apple-darwin" ;;
          Windows-X64) target="x86_64-pc-windows-msvc" ;;
          *)
            echo "aozora-proof: unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        package="aozora-proof-${tag}-${target}"
        archive="${package}.tar.gz"
        repository="${ACTION_REPOSITORY:-P4suta/aozora-proof}"
        base_url="https://github.com/${repository}/releases/download/${tag}"
        install_dir="${RUNNER_TEMP}/aozora-proof-${version}"
        mkdir -p "$install_dir"
        curl --fail --location --silent --show-error \
          --output "${install_dir}/${archive}" "${base_url}/${archive}"
        curl --fail --location --silent --show-error \
          --output "${install_dir}/${archive}.sha256" "${base_url}/${archive}.sha256"
        (
          cd "$install_dir"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check "${archive}.sha256"
          else
            shasum --algorithm 256 --check "${archive}.sha256"
          fi
          tar -xzf "$archive"
        )
        gh attestation verify "${install_dir}/${archive}" --repo "$repository"
        echo "${install_dir}/${package}/bin" >> "$GITHUB_PATH"

    - name: Check
      id: check
      shell: bash
      env:
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_ORTHOGRAPHY: ${{ inputs.orthography }}
      run: |
        set +e
        shopt -s globstar nullglob
        read -r -a patterns <<< "$INPUT_FILES"
        files=()
        for pattern in "${patterns[@]}"; do
          while IFS= read -r match; do
            files+=("$match")
          done < <(compgen -G "$pattern")
        done
        sarif="$RUNNER_TEMP/aozora-proof.sarif"
        if [ "${#files[@]}" -eq 0 ]; then
          echo "aozora-proof: no files matched '$INPUT_FILES'"
          printf '%s\n' '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"aozora-proof"}},"results":[]}]}' > "$sarif"
          echo "exit_code=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        aozora-proof check "${files[@]}" \
          --orthography "$INPUT_ORTHOGRAPHY" \
          --no-input \
          --format sarif \
          --fail-on "$INPUT_FAIL_ON" > "$sarif"
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
      with:
        sarif_file: ${{ runner.temp }}/aozora-proof.sarif

    - name: Enforce threshold
      shell: bash
      env:
        EXIT_CODE: ${{ steps.check.outputs.exit_code }}
      run: exit "$EXIT_CODE"
